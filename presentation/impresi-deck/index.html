<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Functional Analytic Psychotherapy — Impresi Presentation</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0f1115; }
    #board { width: 100vw; height: 100vh; }
    /* Small hint shown until the user starts navigating */
    #hint {
      position: fixed; bottom: 18px; left: 0; right: 0;
      text-align: center; color: rgba(255,255,255,0.55);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; letter-spacing: 0.04em; z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="board"></div>
  <div id="hint">Use → / Space to advance · ← to go back</div>

  <!-- Impresi from CDN -->
  <script src="https://unpkg.com/impresi"></script>
  <script>
    // A slide deck introducing Functional Analytic Psychotherapy (FAP),
    // built with Impresi. Each "screen" brings the previous slide's items
    // out and the new slide's items in.
    var config = {
      resources: [
        // ---------- Slide 1: Title ----------
        { id: "bg1", type: "background", options: { backgroundColor: "#0f1115" } },
        { id: "s1-title", type: "heading", text: "Functional Analytic Psychotherapy",
          options: { fontSize: 5, fontColor: "#7aa2f7", backgroundColor: "transparent",
            inAnimationName: "zoomIn", x: 8, y: 30 } },
        { id: "s1-sub", type: "blurb",
          text: "Using the therapeutic relationship itself to create change",
          options: { fontSize: 3, fontColor: "#c0caf5", backgroundColor: "transparent",
            inAnimationName: "fadeInUp", x: 8, y: 46 } },
        { id: "s1-tag", type: "blurb",
          text: "Awareness · Courage · Love",
          options: { fontSize: 2.4, fontColor: "#9ece6a", backgroundColor: "transparent",
            inAnimationName: "fadeIn", x: 8, y: 60 } },

        // ---------- Slide 2: What is FAP ----------
        { id: "bg2", type: "background", options: { backgroundColor: "#16181d" } },
        { id: "s2-h", type: "heading", text: "What is FAP?",
          options: { fontSize: 5, fontColor: "#fff", backgroundColor: "transparent",
            inAnimationName: "slideInLeft", x: 10, y: 14 } },
        { id: "s2-b1", type: "blurb",
          text: "A behavioral psychotherapy developed by Robert Kohlenberg and Mavis Tsai (1991).",
          options: { fontSize: 2.7, fontColor: "#c0caf5", backgroundColor: "transparent",
            width: 70, inAnimationName: "fadeInUp", x: 10, y: 34 } },
        { id: "s2-b2", type: "blurb",
          text: "Its core premise: meaningful change happens through a genuine, intense, and curative therapeutic relationship.",
          options: { fontSize: 2.7, fontColor: "#c0caf5", backgroundColor: "transparent",
            width: 70, inAnimationName: "fadeInUp", x: 10, y: 54 } },

        // ---------- Slide 3: Clinically Relevant Behaviors ----------
        { id: "bg3", type: "background", options: { backgroundColor: "#1a1d24" } },
        { id: "s3-h", type: "heading", text: "Clinically Relevant Behaviors (CRBs)",
          options: { fontSize: 4, fontColor: "#7aa2f7", backgroundColor: "transparent",
            inAnimationName: "slideInDown", x: 8, y: 12 } },
        { id: "s3-b0", type: "blurb",
          text: "The client's problems show up live, in the room, with the therapist.",
          options: { fontSize: 2.5, fontColor: "#a9b1d6", backgroundColor: "transparent",
            width: 78, inAnimationName: "fadeIn", x: 8, y: 28 } },
        { id: "s3-b1", type: "blurb", text: "CRB1 — problem behaviors as they occur in session",
          options: { fontSize: 2.6, fontColor: "#f7768e", backgroundColor: "transparent",
            inAnimationName: "fadeInUp", x: 10, y: 44 } },
        { id: "s3-b2", type: "blurb", text: "CRB2 — improvements that occur in session",
          options: { fontSize: 2.6, fontColor: "#9ece6a", backgroundColor: "transparent",
            inAnimationName: "fadeInUp", x: 10, y: 58 } },
        { id: "s3-b3", type: "blurb", text: "CRB3 — the client's own talk about their behavior",
          options: { fontSize: 2.6, fontColor: "#e0af68", backgroundColor: "transparent",
            inAnimationName: "fadeInUp", x: 10, y: 72 } },

        // ---------- Slide 4: The Five Rules ----------
        { id: "bg4", type: "background", options: { backgroundColor: "#16181d" } },
        { id: "s4-h", type: "heading", text: "The Five Rules",
          options: { fontSize: 5, fontColor: "#fff", backgroundColor: "transparent",
            inAnimationName: "slideInLeft", x: 10, y: 10 } },
        { id: "s4-r1", type: "blurb", text: "1 · Be aware — watch for CRBs",
          options: { fontSize: 2.5, fontColor: "#c0caf5", backgroundColor: "transparent",
            inAnimationName: "fadeInUp", x: 12, y: 26 } },
        { id: "s4-r2", type: "blurb", text: "2 · Be courageous — evoke CRBs",
          options: { fontSize: 2.5, fontColor: "#c0caf5", backgroundColor: "transparent",
            inAnimationName: "fadeInUp", x: 12, y: 38 } },
        { id: "s4-r3", type: "blurb", text: "3 · Be therapeutically loving — naturally reinforce CRB2s",
          options: { fontSize: 2.5, fontColor: "#c0caf5", backgroundColor: "transparent",
            inAnimationName: "fadeInUp", x: 12, y: 50 } },
        { id: "s4-r4", type: "blurb", text: "4 · Be aware of your impact on the client",
          options: { fontSize: 2.5, fontColor: "#c0caf5", backgroundColor: "transparent",
            inAnimationName: "fadeInUp", x: 12, y: 62 } },
        { id: "s4-r5", type: "blurb", text: "5 · Interpret functionally & generalize to daily life",
          options: { fontSize: 2.5, fontColor: "#c0caf5", backgroundColor: "transparent",
            inAnimationName: "fadeInUp", x: 12, y: 74 } },

        // ---------- Slide 5: Natural reinforcement ----------
        { id: "bg5", type: "background", options: { backgroundColor: "#1a1d24" } },
        { id: "s5-h", type: "heading", text: "Natural reinforcement",
          options: { fontSize: 4.5, fontColor: "#9ece6a", backgroundColor: "transparent",
            inAnimationName: "slideInDown", x: 10, y: 16 } },
        { id: "s5-b", type: "blurb",
          text: "Change is driven by genuine, contingent responding to in-session improvements — not arbitrary praise. The therapist reacts as caring people would in the client's real life.",
          options: { fontSize: 2.8, fontColor: "#c0caf5", backgroundColor: "transparent",
            width: 72, inAnimationName: "fadeInUp", x: 10, y: 36 } },

        // ---------- Slide 6: The ACL model ----------
        { id: "bg6", type: "background", options: { backgroundColor: "#16181d" } },
        { id: "s6-h", type: "heading", text: "The ACL model",
          options: { fontSize: 5, fontColor: "#7aa2f7", backgroundColor: "transparent",
            inAnimationName: "slideInLeft", x: 10, y: 14 } },
        { id: "s6-a", type: "blurb", text: "Awareness — notice what matters, in yourself and the other",
          options: { fontSize: 2.7, fontColor: "#c0caf5", backgroundColor: "transparent",
            inAnimationName: "fadeInUp", x: 12, y: 34 } },
        { id: "s6-c", type: "blurb", text: "Courage — risk emotional exposure and vulnerability",
          options: { fontSize: 2.7, fontColor: "#c0caf5", backgroundColor: "transparent",
            inAnimationName: "fadeInUp", x: 12, y: 50 } },
        { id: "s6-l", type: "blurb", text: "Love — respond with genuine care and connection",
          options: { fontSize: 2.7, fontColor: "#c0caf5", backgroundColor: "transparent",
            inAnimationName: "fadeInUp", x: 12, y: 66 } },

        // ---------- Slide 7: Why it matters ----------
        { id: "bg7", type: "background", options: { backgroundColor: "#1a1d24" } },
        { id: "s7-h", type: "heading", text: "Why it matters",
          options: { fontSize: 5, fontColor: "#fff", backgroundColor: "transparent",
            inAnimationName: "slideInDown", x: 10, y: 16 } },
        { id: "s7-b", type: "blurb",
          text: "By working with behavior as it unfolds in the relationship, FAP builds new interpersonal repertoires that the client can carry into life outside the therapy room.",
          options: { fontSize: 2.8, fontColor: "#c0caf5", backgroundColor: "transparent",
            width: 72, inAnimationName: "fadeInUp", x: 10, y: 36 } },

        // ---------- Slide 8: Closing ----------
        { id: "bg8", type: "background", options: { backgroundColor: "#0f1115" } },
        { id: "s8-h", type: "heading", text: "The relationship is the treatment.",
          options: { fontSize: 4.5, fontColor: "#7aa2f7", backgroundColor: "transparent",
            inAnimationName: "zoomIn", x: 8, y: 40 } },
        { id: "s8-b", type: "blurb", text: "Kohlenberg & Tsai · Functional Analytic Psychotherapy",
          options: { fontSize: 2.4, fontColor: "#9ece6a", backgroundColor: "transparent",
            inAnimationName: "fadeInUp", x: 8, y: 56 } }
      ],

      actions: [
        // screen 1
        { in: ["bg1", "s1-title", "s1-sub", "s1-tag"] },
        // screen 2
        { out: ["bg1", "s1-title", "s1-sub", "s1-tag"] },
        { in: ["bg2", "s2-h", "s2-b1", "s2-b2"] },
        // screen 3
        { out: ["bg2", "s2-h", "s2-b1", "s2-b2"] },
        { in: ["bg3", "s3-h", "s3-b0", "s3-b1", "s3-b2", "s3-b3"] },
        // screen 4
        { out: ["bg3", "s3-h", "s3-b0", "s3-b1", "s3-b2", "s3-b3"] },
        { in: ["bg4", "s4-h", "s4-r1", "s4-r2", "s4-r3", "s4-r4", "s4-r5"] },
        // screen 5
        { out: ["bg4", "s4-h", "s4-r1", "s4-r2", "s4-r3", "s4-r4", "s4-r5"] },
        { in: ["bg5", "s5-h", "s5-b"] },
        // screen 6
        { out: ["bg5", "s5-h", "s5-b"] },
        { in: ["bg6", "s6-h", "s6-a", "s6-c", "s6-l"] },
        // screen 7
        { out: ["bg6", "s6-h", "s6-a", "s6-c", "s6-l"] },
        { in: ["bg7", "s7-h", "s7-b"] },
        // screen 8
        { out: ["bg7", "s7-h", "s7-b"] },
        { in: ["bg8", "s8-h", "s8-b"] }
      ]
    };

    var impresi = new Impresi("board", config);
    impresi.start();

    // Hide the navigation hint once the user starts moving through slides.
    document.addEventListener("keyup", function () {
      var hint = document.getElementById("hint");
      if (hint) hint.style.display = "none";
    });
  </script>
</body>
</html>
